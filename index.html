<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasım–Aralık 2026 Kontrol Listesi</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;padding:clamp(10px,3vw,35px);font-family:Nunito,system-ui,sans-serif;color:#274438;background:radial-gradient(circle at 5% 5%,#e6f3e9,transparent 48%),radial-gradient(circle at 95% 90%,#fff0da,transparent 50%),#f7f8f4;min-height:100vh}.panel{max-width:1320px;margin:auto;padding:clamp(12px,3vw,32px);background:#fffefa;border:1px solid white;border-radius:26px;box-shadow:0 30px 70px #23452d25,0 8px 22px #23452d12}.top{text-align:center;background:linear-gradient(125deg,#fff4e4,#eaf5ed);border:1px solid #eee8d9;border-radius:20px;padding:24px 14px;margin-bottom:20px}h1{font-size:clamp(22px,3.5vw,35px);margin:0;color:#b25c2c}p{font-size:13px;color:#66776b;line-height:1.7}.checkwrap{overflow-x:auto;border:1px solid #e5ebdf;border-radius:16px;background:#f9fbf7;padding:9px;max-width:100%;-webkit-overflow-scrolling:touch}.checktable{border-collapse:separate;border-spacing:3px;min-width:100%;width:max-content}.checktable th{font-size:12px;color:#54705e;padding:10px 4px;white-space:nowrap}.checktable td{padding:3px}.checktable th:first-child,.checktable td:first-child{position:sticky;left:0;background:#fffefa;z-index:3}.checktable th:nth-child(2),.checktable td:nth-child(2){position:sticky;left:155px;background:#fffefa;z-index:3}.checktable td:nth-child(-n+2){border-bottom:1px solid #e6ede5}.checkname{width:155px;min-width:155px;border:0;outline-color:#a5d4b4;background:transparent;font:800 12px Nunito,system-ui;color:#294638;padding:8px 3px}.checksum{font-size:11px;white-space:nowrap;text-align:center;min-width:100px}.checksum span{display:inline-block;padding:5px;border-radius:7px;background:#d2f4dc;color:#17603a;margin:1px;font-weight:800}.checksum span.neg{background:#fbdada;color:#aa2a2a}.checkcell{width:48px;height:48px;border:0;border-radius:11px;background:#edf2ec;color:#325042;font-size:12px;font-weight:900;cursor:pointer;box-shadow:inset 0 1px 2px #fff9,0 2px 4px #24432b0c}.checkcell.bad{background:#fbd6d6;color:#a72323;font-size:25px}.checkcell.good{background:#cef1d7;color:#14683c;font-size:23px}.checkcell.lv1{background:#fff0aa;color:#705100}.checkcell.lv2{background:#ffdab7;color:#813e12}.checkcell.lv3{background:#d0e3ff;color:#254c8d}.checkcell.lv4{background:#e6d9ff;color:#61418f}.checkcell.lv5{background:#c7e9ea;color:#17656b}.checkcell.lv6{background:#bdeacb;color:#175b38}.checknote{margin:14px 4px 0}.checkcell:focus-visible{outline:3px solid #4b8b68}@media(max-width:600px){.panel{border-radius:17px}.checkname{width:125px;min-width:125px;font-size:11px}.checktable th:nth-child(2),.checktable td:nth-child(2){left:125px}.checksum{min-width:80px}.checkcell{width:45px;height:45px}}.monthtabs{display:flex;justify-content:center;gap:10px;margin:0 0 18px}.monthtab{font:900 16px Nunito,system-ui;border:1px solid #cdded1;background:#fffefa;color:#335745;padding:12px 25px;border-radius:14px;cursor:pointer;box-shadow:0 3px 10px #23452d10}.monthtab.active{background:#07583c;color:white;border-color:#07583c;box-shadow:0 6px 15px #07583c33}.monthtab:focus-visible{outline:3px solid #eaa76d}@media(max-width:600px){.monthtab{flex:1;padding:11px}} .scorehead{display:grid;grid-template-columns:minmax(95px,1fr) auto minmax(95px,1fr);align-items:center;gap:12px}.scorebox{border-radius:14px;padding:10px 8px;background:#fffefa;border:1px solid #dbe7dc;text-align:center;box-shadow:0 3px 12px #24452b12}.scorebox.fail{border-color:#f0d6d6}.scorebox strong{display:block;font-size:clamp(21px,3vw,31px);line-height:1.2;color:#13774c}.scorebox.fail strong{color:#b94343}.scorebox small{font-size:11px;font-weight:900;letter-spacing:.2px;color:#607568}.scorecenter h1{margin:0}.scorecenter p{margin:6px 0 0}@media(max-width:600px){.scorehead{grid-template-columns:75px minmax(0,1fr) 75px;gap:6px}.scorebox{padding:9px 3px}.scorebox small{font-size:10px}.scorecenter h1{font-size:clamp(15px,4vw,21px)}.scorecenter p{font-size:10px}} .actions{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;margin:12px 0}.action{border:0;border-radius:12px;background:#146344;color:white;font:800 13px Nunito;padding:11px 15px;cursor:pointer}.action.secondary{background:#f3e9d8;color:#78502c}.rowactions{display:flex;gap:3px;align-items:center}.tiny{border:0;border-radius:7px;background:#e9f0e8;color:#375c48;padding:5px;cursor:pointer;font-size:12px}.tiny.del{color:#a33;background:#fce9e9}.checkname{width:112px;min-width:112px}.checktable th:nth-child(2),.checktable td:nth-child(2){left:155px}.checktable th:first-child,.checktable td:first-child{min-width:155px}@media(max-width:600px){.checktable th:first-child,.checktable td:first-child{min-width:140px}.checktable th:nth-child(2),.checktable td:nth-child(2){left:140px}.checkname{width:98px;min-width:98px}} </style></head><body><main class="panel"><header class="top"><div class="scorehead"><div class="scorebox"><strong id="successpct">%0</strong><small>✓ Başarı</small></div><div class="scorecenter"><h1>📋 <span id="monthtitle">Kasım</span> 2026 Kontrol Listesi</h1><p id="monthdesc">17–30 Kasım · Günlere dokunarak ilerlemeni işaretleyebilirsin.</p></div><div class="scorebox fail"><strong id="failurepct">%0</strong><small>✕ Başarısızlık</small></div></div></header><nav class="monthtabs" aria-label="Ay seçimi"><button class="monthtab active" type="button" data-month="nov">Kasım</button><button class="monthtab" type="button" data-month="dec">Aralık</button></nav><div class="actions"><button class="action" id="addrow">＋ Yeni görev satırı ekle</button><button class="action secondary" id="help">⚙️ Seçenekleri düzenleme</button></div><div class="checkwrap"><table class="checktable"><thead id="checkhead"></thead><tbody id="checkbody"></tbody></table></div><p class="checknote">↔ Diğer tarihleri görmek için tabloyu yana kaydır. Değişikliklerin bu tarayıcıda otomatik saklanır.</p></main><script>
(()=>{
const defaults=['Müdâvemet-i Salât','İctinâb-ı Nevm-i Gaflet','Vazife-i Seher','Vird-i Vuslat','Feth-i Furkan','Lügat-ı Ecnebi','Her Gün 3 ☎️','Tahsilat İçin 3 ☎️','Kitap Okuma','Takvim Okuma','Salât-ı Nâfile','100 Salavât-ı Şerife'];
const choices=[['','✕','✓'],['','✕','✓'],['','✕','F. önce','F. sonra','G. sonra'],['','✕','✓'],['','✕','5s','10s','15s','20s'],['','✕','30dk','1sa','1,5sa','2sa','2,5sa','3sa'],['','✕','1','2','3'],['','✕','1','2','3'],['','✕','15dk','30dk','45dk'],['','✕','TR','TR+PT'],['','✕','Teheccüd','Duhâ','Evvâbîn','Tesbih'],['','✕','✓']];
const keys={nov:'kasim_2026_entegre_v1',dec:'aralik_2026_entegre_v1'};
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}};
const data={nov:read(keys.nov),dec:read(keys.dec)};
// Görev tanımları iki ay için ortaktır; eski kayıtlar korunur.
let config=read('kontrol_gorev_tanimlari_v2');
if(!Array.isArray(config.rows))config.rows=defaults.map((name,i)=>({id:String(i),name,opts:choices[i]}));
for(const m of ['nov','dec']){data[m].cells=data[m].cells||{};data[m].names=data[m].names||[]}
// Önceki sürümde düzenlenmiş adları koru.
config.rows.forEach((r,i)=>{if(data.nov.names[i]&&r.name===defaults[i])r.name=data.nov.names[i]});
let month='nov';const active=()=>data[month];const dates=()=>month==='nov'?Array.from({length:14},(_,i)=>i+17):Array.from({length:31},(_,i)=>i+1);
const save=()=>{localStorage.setItem(keys[month],JSON.stringify(active()));localStorage.setItem('kontrol_gorev_tanimlari_v2',JSON.stringify(config))};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=(t,bad=false)=>`<span class="${bad?'neg':''}">${esc(t)}</span>`;
function get(row,day){const oldKey=`${row.id}-${day}`;return active().cells[oldKey]||0}
function summary(row){const i=+row.id, vals=dates().map((_,d)=>get(row,d)), count=x=>vals.filter(v=>v===x).length, sum=fn=>vals.reduce((a,v)=>a+fn(v),0);
if(Number.isInteger(i)&&i>=0&&i<12&&JSON.stringify(row.opts)===JSON.stringify(choices[i])){
 if([0,1,2,3,11].includes(i))return pill(vals.filter(v=>v>=2).length)+pill(count(1),true);
 if(i===4)return pill(sum(v=>v>=2?(v-1)*5:0)+' sayfa');
 if(i===5||i===8){let mins=sum(v=>i===5?(v>=2?(v-1)*30:0):(v>=2?(v-1)*15:0));return pill(`${Math.floor(mins/60)}sa ${mins%60}dk`)}
 if(i===6||i===7)return pill(sum(v=>Math.max(0,v-1))+' kişi');
 if(i===9)return pill('TR '+count(2))+pill('TR+PT '+count(3));
 return [2,3,4,5].map(v=>count(v)?pill(['','','Teheccüd','Duhâ','Evvâbîn','Tesbih'][v]+' '+count(v)):'').join('');
}
return pill(vals.filter(v=>v>=2).length)+pill(count(1),true);
}
function updatePercentages(){let yes=0,no=0;for(const r of config.rows)for(let d=0;d<dates().length;d++){const v=get(r,d);if(v===1)no++;else if(v>=2)yes++}const total=yes+no;document.getElementById('successpct').textContent='%'+(total?Math.round(yes*100/total):0);document.getElementById('failurepct').textContent='%'+(total?Math.round(no*100/total):0)}
const head=document.getElementById('checkhead'),body=document.getElementById('checkbody');
function draw(){updatePercentages();document.getElementById('monthtitle').textContent=month==='nov'?'Kasım':'Aralık';document.getElementById('monthdesc').textContent=month==='nov'?'17–30 Kasım · Görevleri işaretle, düzenle veya ekle.':'1–31 Aralık · Kasım kayıtların ayrı saklanır.';document.querySelectorAll('[data-month]').forEach(b=>{b.classList.toggle('active',b.dataset.month===month);b.setAttribute('aria-pressed',String(b.dataset.month===month))});
head.innerHTML='<tr><th>Yapılacaklar</th><th>Değerlendirme</th>'+dates().map(d=>`<th>${d}.${month==='nov'?'11':'12'}</th>`).join('')+'</tr>';
body.innerHTML=config.rows.map((r,i)=>`<tr><td><div class="rowactions"><input class="checkname" data-name="${i}" aria-label="Görev adı" value="${esc(r.name)}"><button class="tiny" data-edit="${i}" title="İşaretleme seçeneklerini değiştir">⚙</button><button class="tiny del" data-del="${i}" title="Satırı sil">×</button></div></td><td class="checksum">${summary(r)}</td>${dates().map((_,d)=>{const v=get(r,d),t=r.opts[v]||'',cls=v===1?'bad':v===2&&r.opts.length===3?'good':v>=2?'lv'+Math.min(6,v-1):'';return `<td><button class="checkcell ${cls}" data-row="${i}" data-day="${d}" title="${esc(t||'Boş')}">${esc(t)}</button></td>`}).join('')}</tr>`).join('');
body.querySelectorAll('[data-name]').forEach(x=>x.oninput=()=>{config.rows[+x.dataset.name].name=x.value;save()});
body.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const r=config.rows[+b.dataset.row],d=+b.dataset.day,k=`${r.id}-${d}`;active().cells[k]=(get(r,d)+1)%r.opts.length;save();const sc=document.querySelector('.checkwrap').scrollLeft;draw();document.querySelector('.checkwrap').scrollLeft=sc});
body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRow(+b.dataset.edit));
body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(!confirm('Bu görev satırını iki aydan da silmek istiyor musun?'))return;config.rows.splice(i,1);save();draw()});}
function editRow(i){const r=config.rows[i];const answer=prompt('İşaretleme seçeneklerini virgülle ayırarak yaz. İlk seçenek her zaman boş, ikinci seçenek ✕ olacaktır.\nÖrnek: ✓, 1 saat, 2 saat',r.opts.slice(2).join(', '));if(answer===null)return;const arr=answer.split(',').map(x=>x.trim()).filter(Boolean);if(!arr.length){alert('En az bir olumlu seçenek eklemelisin.');return}r.opts=['','✕',...arr];for(const m of ['nov','dec'])for(const k of Object.keys(data[m].cells))if(k.startsWith(r.id+'-')&&data[m].cells[k]>=r.opts.length)data[m].cells[k]=0;save();draw()}
document.getElementById('addrow').onclick=()=>{const name=prompt('Yeni görev adı:','Yeni görev');if(name===null||!name.trim())return;const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);config.rows.push({id,name:name.trim(),opts:['','✕','✓']});save();draw();document.querySelector('.checkwrap').scrollTop=document.querySelector('.checkwrap').scrollHeight};
document.getElementById('help').onclick=()=>alert('Görev adını doğrudan değiştirebilirsin. Her satırın ⚙ düğmesiyle kendi işaretleme seçeneklerini yazabilirsin. ＋ ile yeni görev ekle, × ile sil. Değişiklikler Kasım ve Aralık için ortak; günlük işaretlemeler ayrıdır.');
document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{month=b.dataset.month;draw();document.querySelector('.checkwrap').scrollLeft=0});draw();
})();
</script></body></html>
