<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasım 2026 Kontrol Listesi</title><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;padding:clamp(10px,3vw,35px);font-family:Nunito,system-ui,sans-serif;color:#274438;background:radial-gradient(circle at 5% 5%,#e6f3e9,transparent 48%),radial-gradient(circle at 95% 90%,#fff0da,transparent 50%),#f7f8f4;min-height:100vh}.panel{max-width:1320px;margin:auto;padding:clamp(12px,3vw,32px);background:#fffefa;border:1px solid white;border-radius:26px;box-shadow:0 30px 70px #23452d25,0 8px 22px #23452d12}.top{text-align:center;background:linear-gradient(125deg,#fff4e4,#eaf5ed);border:1px solid #eee8d9;border-radius:20px;padding:24px 14px;margin-bottom:20px}h1{font-size:clamp(22px,3.5vw,35px);margin:0;color:#b25c2c}p{font-size:13px;color:#66776b;line-height:1.7}.checkwrap{overflow-x:auto;border:1px solid #e5ebdf;border-radius:16px;background:#f9fbf7;padding:9px;max-width:100%;-webkit-overflow-scrolling:touch}.checktable{border-collapse:separate;border-spacing:3px;min-width:100%;width:max-content}.checktable th{font-size:12px;color:#54705e;padding:10px 4px;white-space:nowrap}.checktable td{padding:3px}.checktable th:first-child,.checktable td:first-child{position:sticky;left:0;background:#fffefa;z-index:3}.checktable th:nth-child(2),.checktable td:nth-child(2){position:sticky;left:205px;background:#fffefa;z-index:3}.checktable td:nth-child(-n+2){border-bottom:1px solid #e6ede5}.checkname{width:205px;min-width:205px;border:0;outline-color:#a5d4b4;background:transparent;font:800 12px Nunito,system-ui;color:#294638;padding:8px 3px}.checksum{font-size:11px;white-space:nowrap;text-align:center;min-width:100px}.checksum span{display:inline-block;padding:5px;border-radius:7px;background:#d2f4dc;color:#17603a;margin:1px;font-weight:800}.checksum span.neg{background:#fbdada;color:#aa2a2a}.checkcell{width:48px;height:48px;border:0;border-radius:11px;background:#edf2ec;color:#325042;font-size:12px;font-weight:900;cursor:pointer;box-shadow:inset 0 1px 2px #fff9,0 2px 4px #24432b0c}.checkcell.bad{background:#fbd6d6;color:#a72323;font-size:25px}.checkcell.good{background:#cef1d7;color:#14683c;font-size:23px}.checkcell.lv1{background:#fff0aa;color:#705100}.checkcell.lv2{background:#ffdab7;color:#813e12}.checkcell.lv3{background:#d0e3ff;color:#254c8d}.checkcell.lv4{background:#e6d9ff;color:#61418f}.checkcell.lv5{background:#c7e9ea;color:#17656b}.checkcell.lv6{background:#bdeacb;color:#175b38}.checknote{margin:14px 4px 0}.checkcell:focus-visible{outline:3px solid #4b8b68}@media(max-width:600px){.panel{border-radius:17px}.checkname{width:165px;min-width:165px;font-size:11px}.checktable th:nth-child(2),.checktable td:nth-child(2){left:165px}.checksum{min-width:80px}.checkcell{width:45px;height:45px}}</style></head><body><main class="panel"><header class="top"><h1>📋 Kasım 2026 Kontrol Listesi</h1><p>17–30 Kasım · Görevleri düzenleyebilir, günlere dokunarak ilerlemeni işaretleyebilirsin.</p></header><div class="checkwrap"><table class="checktable"><thead id="checkhead"></thead><tbody id="checkbody"></tbody></table></div><p class="checknote">↔ Diğer tarihleri görmek için tabloyu yana kaydır. Değişikliklerin bu tarayıcıda otomatik saklanır.</p></main><script>
(()=>{
const labels=['Müdâvemet-i Salât','İctinâb-ı Nevm-i Gaflet','Vazife-i Seher','Vird-i Vuslat','Feth-i Furkan','Lügat-ı Ecnebi','Her Gün 3 ☎️','Tahsilat İçin 3 ☎️','Kitap Okuma','Takvim Okuma','Salât-ı Nâfile'];
const opts=[['','✕','✓'],['','✕','✓'],['','✕','F. önce','F. sonra','G. sonra'],['','✕','✓'],['','✕','5s','10s','15s','20s'],['','✕','30dk','1sa','1,5sa','2sa','2,5sa','3sa'],['','✕','1','2','3'],['','✕','1','2','3'],['','✕','15dk','30dk','45dk'],['','✕','TR','TR+PT'],['','✕','Teheccüd','Duhâ','Evvâbîn','Tesbih']];
let store;try{store=JSON.parse(localStorage.getItem('kasim_2026_entegre_v1')||'{}')}catch{store={}}store.names=store.names||labels;store.cells=store.cells||{};
function persist(){localStorage.setItem('kasim_2026_entegre_v1',JSON.stringify(store))}
const head=document.getElementById('checkhead'),body=document.getElementById('checkbody');head.innerHTML='<tr><th>Yapılacaklar</th><th>Değerlendirme</th>'+Array.from({length:14},(_,i)=>`<th>${i+17}.11</th>`).join('')+'</tr>';
function summary(i){const vals=Array.from({length:14},(_,d)=>store.cells[`${i}-${d}`]||0);const count=x=>vals.filter(v=>v===x).length;const sum=fn=>vals.reduce((a,v)=>a+fn(v),0);const pill=(t,bad=false)=>`<span class="${bad?'neg':''}">${t}</span>`;if([0,1,2,3].includes(i))return pill(vals.filter(v=>v>=2).length)+pill(count(1),true);if(i===4)return pill(sum(v=>v>=2?(v-1)*5:0)+' sayfa');if(i===5||i===8){let mins=sum(v=>i===5?(v>=2?(v-1)*30:0):(v>=2?(v-1)*15:0));return pill(`${Math.floor(mins/60)}sa ${mins%60}dk`)}if(i===6||i===7)return pill(sum(v=>Math.max(0,v-1))+' kişi');if(i===9)return pill('TR '+count(2))+pill('TR+PT '+count(3));return [2,3,4,5].map(v=>count(v)?pill(['','','Teheccüd','Duhâ','Evvâbîn','Tesbih'][v]+' '+count(v)):'').join('')}
function draw(){body.innerHTML=labels.map((_,i)=>`<tr><td><input class="checkname" data-name="${i}" aria-label="Görev adı" value="${(store.names[i]||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></td><td class="checksum">${summary(i)}</td>${Array.from({length:14},(_,d)=>{const v=store.cells[`${i}-${d}`]||0;const t=opts[i][v]||'';const cls=v===1?'bad':v===2&&[0,1,3].includes(i)?'good':v>=2?'lv'+Math.min(6,v-1):'';return `<td><button class="checkcell ${cls}" data-row="${i}" data-day="${d}" title="${t||'Boş'}">${t}</button></td>`}).join('')}</tr>`).join('');body.querySelectorAll('[data-name]').forEach(x=>x.oninput=()=>{store.names[+x.dataset.name]=x.value;persist()});body.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const i=+b.dataset.row,d=+b.dataset.day,k=`${i}-${d}`;store.cells[k]=((store.cells[k]||0)+1)%opts[i].length;persist();draw()})}draw();
})();
</script></body></html>
